databases:
  - name: clinic-ai-db
    plan: free
    databaseName: clinic_ai_db
    user: clinic_user
    postgresMajorVersion: "15"

services:
  # Backend API
  - type: web
    name: clinic-ai-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://clinic-ai-frontend.onrender.com

  # Frontend static site
  - type: web
    name: clinic-ai-frontend
    plan: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://clinic-ai-backend.onrender.com/api
